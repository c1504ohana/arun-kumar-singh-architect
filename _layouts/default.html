<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="theme-color" content="#1c2521">
  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  {% if page.url == '/' %}
    <link rel="preload" as="image" href="{{ '/assets/images/home-slides/construction-tower-960.webp' | relative_url }}" imagesrcset="{{ '/assets/images/home-slides/construction-tower-960.webp' | relative_url }} 960w, {{ '/assets/images/home-slides/construction-tower.webp' | relative_url }} 1920w" imagesizes="100vw" fetchpriority="high">
  {% endif %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body class="page-{{ page.title | slugify }}">
  <a class="skip-link" href="#main-content">Skip to content</a>
  {% include nav.html %}
  <main id="main-content">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/language-switcher.js' | relative_url }}" defer></script>
  {% if page.url == '/' %}
    <script src="{{ '/assets/js/home-slideshow.js' | relative_url }}" defer></script>
  {% endif %}
</body>
</html>
