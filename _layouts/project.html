---
layout: default
---
<article class="project">
  <h1>{{ page.title }}</h1>
  <p class="project__meta">{{ page.year }} &middot; {{ page.location }}</p>
  {% if page.image %}
    <img class="project__image" src="{{ page.image | relative_url }}" alt="{{ page.title }}">
  {% endif %}
  <div class="project__body">
    {{ content }}
  </div>
</article>
